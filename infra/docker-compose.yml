services:
  postgres:
    image: postgres:16
    container_name: motohive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: motohive_db
      POSTGRES_USER: motohive
      POSTGRES_PASSWORD: motohive
    ports:
      - "5433:5432"          # 5433 host → 5432 container, so it coexists with your native 5432
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motohive -d motohive_db"]
      interval: 5s
      timeout: 5s
      retries: 10