spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5          # Render starter Postgres is small; don't exhaust connections
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}                # Render injects $PORT
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info