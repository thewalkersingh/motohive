services:
  postgres:
    image: postgres:16
    container_name: motohive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: motohive
      POSTGRES_USER: motohive
      POSTGRES_PASSWORD: motohive
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motohive -d motohive"]
      interval: 5s
      timeout: 5s
      retries: 10